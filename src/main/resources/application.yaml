spring:
  application:
    name: mercado-express


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mercado_express}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false


app:
  admin:
    email: ${ADMIN_EMAIL:admin@mercadoexpress.com}
    password: ${ADMIN_PASSWORD:admin12345}

server:

  port: ${PORT:8080}