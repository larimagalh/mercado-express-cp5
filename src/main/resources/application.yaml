
spring:
  application:
    name: mercado-express

  datasource:
    url: jdbc:postgresql://localhost:5432/mercado_express
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

server:
  port: 8080
